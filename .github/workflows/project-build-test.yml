name: Build and test the project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-doc:
    runs-on: ubuntu-latest
    container:
      image: "ghcr.io/astral-sh/uv:python3.13-trixie"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Required to avoid 'dubious ownership' errors when running Git commands within the container
      - name: Add GitHub workspace as Git safe directory within container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build documentation
        run: ./tools/build-docs.sh

      - name: Upload documentation
        uses: actions/upload-artifact@v6
        with:
          name: documentation
          path: "build/html"
          retention-days: 1

  build-app:
    runs-on: ubuntu-latest
    container:
      image: "ghcr.io/astral-sh/uv:python3.13-trixie"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Required to avoid 'dubious ownership' errors when running Git commands within the container
      - name: Add GitHub workspace as Git safe directory within container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build Python package
        run: ./tools/build-package.sh

      - name: Upload Python package
        uses: actions/upload-artifact@v6
        with:
          name: python-package
          path: "dist/*.whl"
          retention-days: 1

  test-app:
    runs-on: ubuntu-latest
    container:
      image: "ghcr.io/astral-sh/uv:python3.13-trixie"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Required to avoid 'dubious ownership' errors when running Git commands within the container
      - name: Add GitHub workspace as Git safe directory within container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run linters
        run: tools/lint-package.sh
        continue-on-error: true

      - name: Upload lint results
        uses: actions/upload-artifact@v6
        with:
          name: lint-results
          path: "build/*.txt"
          retention-days: 1

      - name: Run tests
        run: ./tools/test-package.sh

      - name: Upload test results
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: "build/*.xml"
          retention-days: 1
