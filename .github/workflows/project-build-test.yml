name: Build and test the project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-doc:
    runs-on: ubuntu-latest
    container:
      image: "ghcr.io/astral-sh/uv:python3.13-trixie@sha256:fcd93698a75c0fb5cd180788cab96e5b96c30461a03caf53c1d3fa5495fdd421"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Required to avoid 'dubious ownership' errors when running Git commands within the container
      - name: Add GitHub workspace as Git safe directory within container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build documentation
        run: ./tools/build-docs.sh

      - name: Upload documentation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: documentation
          path: "build/html"
          retention-days: 1

  build-app:
    runs-on: ubuntu-latest
    container:
      image: "ghcr.io/astral-sh/uv:python3.13-trixie@sha256:fcd93698a75c0fb5cd180788cab96e5b96c30461a03caf53c1d3fa5495fdd421"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Required to avoid 'dubious ownership' errors when running Git commands within the container
      - name: Add GitHub workspace as Git safe directory within container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build Python package
        run: ./tools/build-package.sh

      - name: Upload Python package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-package
          path: "dist/*.whl"
          retention-days: 1

  test-app:
    runs-on: ubuntu-latest
    container:
      image: "ghcr.io/astral-sh/uv:python3.13-trixie@sha256:fcd93698a75c0fb5cd180788cab96e5b96c30461a03caf53c1d3fa5495fdd421"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Required to avoid 'dubious ownership' errors when running Git commands within the container
      - name: Add GitHub workspace as Git safe directory within container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run linters
        run: tools/lint-package.sh
        continue-on-error: true

      - name: Upload lint results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lint-results
          path: "build/*.txt"
          retention-days: 1

      - name: Run tests
        run: ./tools/test-package.sh

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results
          path: "build/*.xml"
          retention-days: 1
